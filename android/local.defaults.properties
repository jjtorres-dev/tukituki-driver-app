# Default/placeholder values used by the Secrets Gradle Plugin when
# android/secrets.properties does not exist locally (e.g. CI, fresh
# clone). This file is versioned and MUST NOT contain a real API key.
#
# To use the real Google Maps key, create android/secrets.properties
# (gitignored) with:
#   MAPS_API_KEY=<real key from Google Cloud>
MAPS_API_KEY=DEFAULT_API_KEY
