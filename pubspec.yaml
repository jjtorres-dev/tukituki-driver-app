name: driver
description: "TukiTuki Conductor App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.11.0
  flutter_riverpod: 2.6.1
  go_router: ^17.4.0
  flutter_secure_storage: 10.3.1
  geolocator: ^14.0.3
  google_maps_flutter: ^2.18.0
  image_picker: ^1.2.3
  file_picker: ^12.0.0

  # Push notifications (DRIVER-PUSH-R1, Etapa 1: init + registro de
  # dispositivo). firebase_messaging >= 14.7.0 es lo que hace que
  # requestPermission() dispare el diálogo POST_NOTIFICATIONS en
  # Android 13+, sin necesidad de permission_handler.
  firebase_core: ^3.15.0
  firebase_messaging: ^15.2.0

  # Notificaciones locales (DRIVER-PUSH-R1, Etapa 2: aviso visible en
  # foreground). Se usa para materializar en la barra de estado la
  # `RemoteMessage` que llega con la app abierta; FCM no dibuja nada
  # solo en ese caso.
  flutter_local_notifications: ^22.3.0

  # Promovido de dependencia transitiva a directa: se usa para generar
  # el device_id estable por instalación (DeviceIdStore).
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_secure_storage_platform_interface: ^2.0.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/tukituki_driver_logo.png